name: job-search-agent

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg18
    restart: unless-stopped
    command: ['postgres', '-c', 'timezone=${TZ:-Asia/Jerusalem}', '-c', 'log_timezone=${TZ:-Asia/Jerusalem}']
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ:-Asia/Jerusalem}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.10.3
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--appendfsync', 'everysec']
    environment:
      TZ: ${TZ:-Asia/Jerusalem}
    ports:
      - '127.0.0.1:${REDIS_PORT:-6380}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  loki:
    image: grafana/loki:3.7.10
    restart: unless-stopped
    command: ['-config.file=/etc/loki/config.yaml']
    environment:
      TZ: ${TZ:-Asia/Jerusalem}
    ports:
      - '127.0.0.1:${LOKI_PORT:-3100}:3100'
    volumes:
      - ./docker/loki/config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki

  grafana:
    image: grafana/grafana:13.3.1
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/job-agent-logs.json
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      TZ: ${TZ:-Asia/Jerusalem}
    ports:
      - '127.0.0.1:${GRAFANA_PORT:-3003}:3000'
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - loki

volumes:
  postgres-data:
  redis-data:
  loki-data:
  grafana-data:
